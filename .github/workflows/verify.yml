name: Verify lab changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify numerical examples
        run: node --test tests/*.test.mjs
      - name: Prepare static site
        run: node scripts/build-course.mjs
